name: Unit

on: [push, pull_request]

env:
  GITHUB_ACTIONS: true

jobs:
  test:
    name: "Tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: 'go.mod' }
      - run: go version
      - run: make workspace
        # A pull request labeled pending-next-release has a nested module that
        # requires a root version not tagged yet, so build the nested modules
        # against this checkout. See DEVELOPER_GUIDE.md#nested-modules.
        if: contains(github.event.pull_request.labels.*.name, 'pending-next-release')
      - run: make test-unit race=true
        if: matrix.os != 'ubuntu-latest'
      - run: make test-unit race=true coverage=true
        if: matrix.os == 'ubuntu-latest'
      - id: covfiles
        # Collect every coverage profile make test-unit produced (root +
        # each nested module) so codecov picks up new modules with no edit.
        run: echo "files=$(ls tmp/*.cov | paste -sd, -)" >> "$GITHUB_OUTPUT"
        if: matrix.os == 'ubuntu-latest'
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.covfiles.outputs.files }}
          flags: unit
        if: matrix.os == 'ubuntu-latest'

  jsonv2:
    # internal/jsonx is the standard library's encoding/json where the toolchain
    # builds encoding/json/v2, and go-json-experiment/json elsewhere. The test
    # job runs the go.mod toolchain without the experiment, so this job builds
    # and tests the other file.
    name: "Tests (GOEXPERIMENT=jsonv2)"
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: 'go.mod' }
      - run: go version
      - run: make workspace
        # See the test job.
        if: contains(github.event.pull_request.labels.*.name, 'pending-next-release')
      - run: make test-unit race=true

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: 'go.mod' }
      - run: go version
      - run: make workspace
        # See the test job.
        if: contains(github.event.pull_request.labels.*.name, 'pending-next-release')
      - run: make test-bench
      - run: make test-alloc

  modules:
    name: Nested modules build standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: 'go.mod' }
      - run: go version
      - run: make check-modules-standalone
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'pending-next-release') }}
      # A required root version that is not tagged yet cannot resolve
      # standalone, so replace it with the checkout and check the rest.
      - run: make check-modules-pending
        if: contains(github.event.pull_request.labels.*.name, 'pending-next-release')

  samples:
    name: Build samples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: 'go.mod' }
      - run: go version
      - run: make build-samples

