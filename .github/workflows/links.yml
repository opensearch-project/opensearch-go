name: Link Checker

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  linkchecker:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # CHANGELOG.md holds hundreds of GitHub PR/issue links; checking all of
      # them live on every run draws transient 500/503s that fail unrelated
      # PRs. The cache lets a link that passed within the last day skip the
      # request. 5xx results are never cached, so those links are rechecked
      # next run rather than trusted.
      - name: Restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # A pull request labeled pending-next-release documents symbols that
      # pkg.go.dev cannot serve until the release is tagged, so a link to one
      # of their anchors fails --include-fragments. Exclude this module's
      # pkg.go.dev pages for such a pull request only.
      - name: Skip pkg.go.dev for unreleased symbols
        id: unreleased
        if: contains(github.event.pull_request.labels.*.name, 'pending-next-release')
        run: echo 'args=--exclude "^https://pkg.go.dev/github.com/opensearch-project/opensearch-go/"' >> "$GITHUB_OUTPUT"

      # Blocking: fail the build only on genuinely broken links (4xx/5xx,
      # DNS failures, timeouts). Redirects are accepted here so a moved link
      # does not break CI on its own -- the pass below surfaces those.
      # CHANGELOG compare links are excluded: a release PR adds one for a tag
      # that is only created after the PR merges.
      # --include-fragments also checks the #anchor of a link to a heading.
      - name: Check for broken links
        id: lychee-broken
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --cache --max-cache-age 1d --cache-exclude-status '500..=599' --include-fragments --accept=200,206,301,302,307,308,403,429 --max-retries=3 --retry-wait-time=10 "**/*.html" "**/*.md" "**/*.txt" "**/*.json" --exclude "https://opensearch-domain.region.com/" --exclude "https://github.com/\[your*" --exclude "https://localhost:9200" --exclude "https://codecov.io/gh/opensearch-project/opensearch-go/branch/main/graph/badge.svg" --exclude "^https://github.com/opensearch-project/opensearch-go/compare/" ${{ steps.unreleased.outputs.args }}
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Non-blocking: surface permanent redirects (301/308) so their links can
      # be updated to point at the final destination. --max-redirects=0 makes
      # lychee report the redirect status instead of following it; 302/307 stay
      # accepted because temporary redirects are not a signal to rewrite a link.
      # LICENSE.txt/NOTICE.txt are excluded here: their URLs are canonical
      # license text and standard attribution wording, not links to rewrite.
      # fail:false + if:always() so this always reports without breaking CI.
      # No --cache here: the blocking pass caches the post-redirect 200, which
      # would hide the redirect this pass exists to report.
      - name: Check for permanently-redirecting links
        id: lychee-redirects
        if: always()
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --accept=200,206,302,307,403,429 --max-redirects=0 --max-retries=3 --retry-wait-time=10 --exclude-path LICENSE.txt --exclude-path NOTICE.txt "**/*.html" "**/*.md" "**/*.txt" "**/*.json" --exclude "https://opensearch-domain.region.com/" --exclude "https://github.com/\[your*" --exclude "https://localhost:9200" --exclude "https://codecov.io/gh/opensearch-project/opensearch-go/branch/main/graph/badge.svg" --exclude "^https://github.com/opensearch-project/opensearch-go/compare/"
          fail: false
          jobSummary: true
          output: lychee/redirects.md
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Turn each redirect the pass above found into a PR annotation, so a moved
      # link shows up inline on the PR (Files changed + checks summary) instead
      # of only in the run's job summary. Never fails the build.
      - name: Annotate redirecting links
        if: always()
        run: |
          report="lychee/redirects.md"
          [ -f "$report" ] || { echo "no redirect report found; nothing to annotate"; exit 0; }
          awk '
            /^### Errors in / { file=$0; sub(/^### Errors in /, "", file); next }
            /^\* \[30[0-9]\]/ {
              url=$0; sub(/^[^<]*</, "", url); sub(/>.*/, "", url)
              code=$0; sub(/^\* \[/, "", code); sub(/\].*/, "", code)
              line=""; col=""; tmp=$0
              if (sub(/^.*\(at /, "", tmp) && match(tmp, /^[0-9]+:[0-9]+/)) {
                pos=substr(tmp, 1, RLENGTH); split(pos, a, ":"); line=a[1]; col=a[2]
              }
              printf "::warning file=%s,line=%s,col=%s,title=Redirecting link::%s redirects (%s) -- update to its final destination\n", file, line, col, url, code
            }
          ' "$report"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
